name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
      - name: Install Qt (Windows)
        uses: jurplel/install-qt-action@v4.3.1
        if: runner.os == 'Windows'
        with:
          version: '6.10.3' # aqt has bug with latest qt versions in windows
          target: 'desktop'
          arch: 'win64_mingw'
          cache: true
          tools: 'tools_mingw1310'
          aqtversion: ==3.3.*

      - name: Install Qt (Linux)
        uses: jurplel/install-qt-action@v4.3.1
        if: runner.os == 'Linux'
        with:
          version: '6.12.0'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true
          aqtversion: ==3.3.*

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.build_type }}

      - name: Install CQtDeployer
        uses: QuasarApp/cqtdeployer-install-action@v1.0.1

      - name: Locate aqt MSVCRT MinGW runtime (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: cmd
        run: |
          echo "=== LOCATE AQT MINGW RUNTIME ==="
          echo "IQTA_TOOLS=%IQTA_TOOLS%"
          echo "--- dir IQTA_TOOLS ---"
          dir "%IQTA_TOOLS%" 2>nul
          echo "--- where gcc ---"
          where gcc 2>nul
          echo "--- where g++ ---"
          where g++ 2>nul
          echo "--- dir D:\a\Heart\Qt ---"
          dir "D:\a\Heart\Qt" 2>nul
          echo "--- find libstdc++-6.dll under D:\a\Heart\Qt ---"
          dir /s /b "D:\a\Heart\Qt\libstdc++-6.dll" 2>nul
          echo "--- find libstdc++-6.dll under IQTA_TOOLS ---"
          dir /s /b "%IQTA_TOOLS%\libstdc++-6.dll" 2>nul
          echo "--- cqt dir ---"
          dir "%GITHUB_WORKSPACE%\cqt" 2>nul
          echo "=== END ==="

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B ${{ github.workspace }}/build
          -G Ninja
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}
          -S ${{ github.workspace }}

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B ${{ github.workspace }}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }} --parallel 4

      - name: ccache statistics
        run: ccache -s

      - name: Run Tests
        env:
          QT_FORCE_STDERR_LOGGING: 1
          QT_ASSUME_STDERR_HAS_CONSOLE: 1
        run: cmake --build ${{ github.workspace }}/build --target test 
