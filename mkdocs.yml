# Heart documentation site (GitHub Pages)
#
# Built with MkDocs + the Material theme. Before `mkdocs build` runs,
# the "Deploy Documentation (GitHub Pages)" workflow copies the root
# README.md to docs/index.md (the site home page) and generates the
# Doxygen HTML output into docs/api/, so the API section of the site
# is served from /api/.

site_name: Heart
site_description: QuasarApp Heart - base backend for C++/Qt projects
site_url: https://quasarapp.github.io/Heart/

repo_name: QuasarApp/Heart
repo_url: https://github.com/QuasarApp/Heart
edit_uri: https://github.com/QuasarApp/Heart/edit/main/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      # Soft palette derived from res/Banner_Web.png. These entries set the
      # data-md-color-* page attributes (scheme switching / persistence),
      # but Material ships no prebuilt rules for custom hex values, so the
      # actual CSS variable overrides live in docs/overrides/main.css
      # (attached via extra_css).
      # Mid maroon (#7f2a19) top bar, soft coral (#b84e38) links.
      primary: "#7f2a19"
      accent: "#b84e38"
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      # Same maroon top bar on the slate neutrals, soft salmon
      # (#e8917a) links for contrast on the dark background.
      primary: "#7f2a19"
      accent: "#e8917a"
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc

# Material for MkDocs only ships prebuilt palette rules for the named
# Material colors, so the banner-derived custom palette is applied through
# this extra stylesheet (loaded after the theme CSS, see the file header
# in docs/overrides/main.css for the color choices).
extra_css:
  - overrides/main.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  # index.md is copied from the root README.md by the documentation
  # workflow before the MkDocs build, so the README stays the single
  # source of truth and the generated copy is not committed.
  - Home: index.md
  # api/index.html is the static Doxygen index generated into docs/api/
  # by the documentation workflow before the MkDocs build.
  - API: api/index.html
