# Heart documentation site (GitHub Pages)
#
# Built with MkDocs + the Material theme. The Doxygen HTML output is
# generated into docs/api/ by the "Deploy Documentation (GitHub Pages)"
# workflow before `mkdocs build` runs, so the API section of the site
# is served from /api/.

site_name: Heart
site_description: QuasarApp Heart - base backend for C++/Qt projects
site_url: https://quasarapp.github.io/Heart/

repo_name: QuasarApp/Heart
repo_url: https://github.com/QuasarApp/Heart
edit_uri: https://github.com/QuasarApp/Heart/edit/main/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  # api/index.html is the static Doxygen index generated into docs/api/
  # by the documentation workflow before the MkDocs build.
  - API: api/index.html
